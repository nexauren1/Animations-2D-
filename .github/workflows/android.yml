name: Android APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'google-services.json'
      - '.github/workflows/android.yml'
      - '.github/scripts/**'
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
      FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
      FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Instalar Java para Android
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Flutter estável
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Gerar estrutura Android e definir SDK mínimo
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name animpro --org com.nexauren .
          fi
          python3 - <<'PY'
          from pathlib import Path
          import re
          for name in ("android/app/build.gradle.kts", "android/app/build.gradle"):
              path = Path(name)
              if not path.exists():
                  continue
              text = path.read_text()
              text = re.sub(r"minSdk\s*=\s*flutter\.minSdkVersion", "minSdk = 24", text)
              text = re.sub(r"minSdkVersion\s*=\s*flutter\.minSdkVersion", "minSdkVersion = 24", text)
              text = re.sub(r"minSdkVersion\s+21", "minSdkVersion 24", text)
              path.write_text(text)
              print(f"SDK mínimo ajustado para 24 em {name}")
          PY

      - name: Configurar google-services.json opcional
        run: python3 .github/scripts/configure_firebase_android.py

      - name: Instalar dependências
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          dart --version
          flutter pub get 2>&1 | tee pub-get.log

      - name: Gerar código Isar
        shell: bash
        run: |
          set -euo pipefail
          dart run build_runner build --delete-conflicting-outputs -v 2>&1 | tee isar-codegen.log
          test -s lib/models/project_model.g.dart

      - name: Configurar assinatura permanente
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 .github/scripts/prepare_android_signing.py

      - name: Análise estática para diagnóstico
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          flutter analyze --no-pub 2>&1 | tee flutter-analyze.log

      - name: Compilar APK release assinado
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --release --no-pub \
            --dart-define=FIREBASE_API_KEY="$FIREBASE_API_KEY" \
            --dart-define=FIREBASE_APP_ID="$FIREBASE_APP_ID" \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID="$FIREBASE_MESSAGING_SENDER_ID" \
            --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID" \
            --dart-define=GOOGLE_WEB_CLIENT_ID="$GOOGLE_WEB_CLIENT_ID" \
            --dart-define=FIREBASE_NATIVE_CONFIG="$FIREBASE_NATIVE_CONFIG" 2>&1 | tee build.log
          test -s build/app/outputs/flutter-apk/app-release.apk

      - name: Verificar assinatura permanente
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          BUILD_TOOLS="$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          APK="build/app/outputs/flutter-apk/app-release.apk"
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          mkdir -p dist
          cp "$APK" dist/AnimPro-release-signed.apk
          sha256sum dist/AnimPro-release-signed.apk > dist/SHA256SUMS.txt

      - name: Guardar APK assinado
        uses: actions/upload-artifact@v4
        with:
          name: AnimPro-Android-Release-Signed
          path: |
            dist/AnimPro-release-signed.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Anexar APK assinado à Release do GitHub
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/AnimPro-release-signed.apk
            dist/SHA256SUMS.txt

      - name: Guardar logs de diagnóstico se houver falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: AnimPro-Build-Diagnostics
          path: |
            pub-get.log
            isar-codegen.log
            flutter-analyze.log
            build.log
          if-no-files-found: ignore
          retention-days: 14
