name: Validate payment backend syntax

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - '.github/scripts/paypal_catalog.mjs'
      - '.github/workflows/paypal-setup.yml'
      - '.github/workflows/validate-payments.yml'
  pull_request:
    branches: [main]
    paths:
      - 'functions/**'
      - '.github/scripts/paypal_catalog.mjs'
      - '.github/workflows/paypal-setup.yml'
      - '.github/workflows/validate-payments.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          node --check functions/index.js
          node --check .github/scripts/paypal_catalog.mjs
          node -e "const p=require('./functions/package.json'); if(p.engines.node!=='22') process.exit(1); console.log('Runtime Node.js 22 configurado.')"
