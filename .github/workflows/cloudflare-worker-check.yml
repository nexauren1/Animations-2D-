name: Validate Cloudflare PayPal Worker

on:
  push:
    branches:
      - main
    paths:
      - cloudflare-worker/**
      - wrangler.toml
      - .github/workflows/cloudflare-worker-check.yml
  pull_request:
    branches:
      - main
    paths:
      - cloudflare-worker/**
      - wrangler.toml
      - .github/workflows/cloudflare-worker-check.yml

permissions:
  contents: read

jobs:
  validate-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check Worker JavaScript syntax
        run: node --check cloudflare-worker/src/index.js

      - name: Test Worker authentication and route guards
        run: npm --prefix cloudflare-worker test

      - name: Bundle Worker with Wrangler without deployment
        run: npx --yes wrangler@4 deploy --dry-run --outdir /tmp/animpro-worker-dry-run
