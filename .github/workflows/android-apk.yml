name: Build single optimized AnimPro release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: animpro-android-apk
  cancel-in-progress: true

jobs:
  build:
    name: Build one signed universal release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Support values saved as either repository Variables or Secrets.
      FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY || secrets.FIREBASE_API_KEY }}
      FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID || secrets.FIREBASE_APP_ID }}
      FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID || secrets.FIREBASE_MESSAGING_SENDER_ID }}
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID || secrets.FIREBASE_PROJECT_ID }}
      GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID || secrets.GOOGLE_WEB_CLIENT_ID }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android platform files if missing
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name animpro --org com.nexauren /tmp/animpro-platform
            cp -a /tmp/animpro-platform/android ./android
          fi

      - name: Configure AnimPro launcher icon
        run: python3 .github/scripts/configure_android_app_icon.py

      - name: Configure native H.264 video export
        run: python3 .github/scripts/configure_android_native_video_export.py

      - name: Configure optional google-services.json
        run: python3 .github/scripts/configure_firebase_android.py

      - name: Resolve Google Web OAuth client ID
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GOOGLE_WEB_CLIENT_ID:-}" && -s android/app/google-services.json ]]; then
            client_id="$(python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("android/app/google-services.json").read_text(encoding="utf-8"))
          for client in data.get("client", []):
              info = client.get("client_info", {})
              if info.get("android_client_info", {}).get("package_name") != "com.nexauren.animpro":
                  continue
              for oauth in client.get("oauth_client", []):
                  if oauth.get("client_type") == 3 and oauth.get("client_id"):
                      print(oauth["client_id"])
                      raise SystemExit(0)
          PY
          )"
            if [[ -n "$client_id" ]]; then
              echo "GOOGLE_WEB_CLIENT_ID=$client_id" >> "$GITHUB_ENV"
              echo "Resolved Google Web OAuth client ID from google-services.json."
            else
              echo "::warning::No Web OAuth client was found in google-services.json."
            fi
          fi

      - name: Validate Firebase release configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${FIREBASE_NATIVE_CONFIG:-false}" != "true" ]]; then
            missing=()
            for name in FIREBASE_API_KEY FIREBASE_APP_ID FIREBASE_MESSAGING_SENDER_ID FIREBASE_PROJECT_ID; do
              if [[ -z "${!name:-}" ]]; then missing+=("$name"); fi
            done
            if (( ${#missing[@]} > 0 )); then
              printf '::error::Configuração Firebase incompleta. Adiciona os valores como Actions Variables ou Secrets: %s\n' "${missing[*]}"
              exit 1
            fi
          fi
          if [[ -z "${GOOGLE_WEB_CLIENT_ID:-}" && "${FIREBASE_NATIVE_CONFIG:-false}" != "true" ]]; then
            echo "::warning::GOOGLE_WEB_CLIENT_ID não está definido. O login com Google ficará desativado; confirma a configuração OAuth se precisares dessa opção."
          fi

      - name: Resolve packages and generate Isar model
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          test -s lib/models/project_model.g.dart

      - name: Configure permanent release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 .github/scripts/prepare_android_signing.py

      - name: Verify Google sign-in release fingerprint
        run: python3 .github/scripts/validate_google_oauth_fingerprint.py

      - name: Build exactly one optimized universal APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/symbols dist
          flutter --version
          flutter build apk --release --no-pub \
            --obfuscate \
            --split-debug-info=build/symbols \
            --dart-define=FIREBASE_API_KEY="$FIREBASE_API_KEY" \
            --dart-define=FIREBASE_APP_ID="$FIREBASE_APP_ID" \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID="$FIREBASE_MESSAGING_SENDER_ID" \
            --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID" \
            --dart-define=GOOGLE_WEB_CLIENT_ID="$GOOGLE_WEB_CLIENT_ID" \
            --dart-define=FIREBASE_NATIVE_CONFIG="$FIREBASE_NATIVE_CONFIG"
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          cp "$APK" dist/AnimPro-release-signed.apk
          test -d build/symbols
          tar -czf dist/AnimPro-private-debug-symbols.tar.gz -C build/symbols .
          sha256sum dist/AnimPro-release-signed.apk > dist/SHA256SUMS.txt

      - name: Sign APK with legacy and modern Android schemes
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          BUILD_TOOLS="$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/apksigner" sign \\
            --ks "$RUNNER_TEMP/animations2d-release.jks" \\
            --ks-key-alias "$ANDROID_KEY_ALIAS" \\
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \\
            --key-pass env:ANDROID_KEY_PASSWORD \\
            --v1-signing-enabled true \\
            --v2-signing-enabled true \\
            --v3-signing-enabled true \\
            --out "$RUNNER_TEMP/AnimPro-release-compatible.apk" \\
            dist/AnimPro-release-signed.apk
          mv "$RUNNER_TEMP/AnimPro-release-compatible.apk" dist/AnimPro-release-signed.apk
          sha256sum dist/AnimPro-release-signed.apk > dist/SHA256SUMS.txt

      - name: Verify final APK signature
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          BUILD_TOOLS="$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/apksigner" verify --verbose dist/AnimPro-release-signed.apk

      - name: Verify APK installs on Android 13 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_2
          script: adb install dist/AnimPro-release-signed.apk

      - name: Store one APK plus checksum and private symbol map
        uses: actions/upload-artifact@v4
        with:
          name: AnimPro-Android-Release
          path: |
            dist/AnimPro-release-signed.apk
            dist/SHA256SUMS.txt
            dist/AnimPro-private-debug-symbols.tar.gz
          if-no-files-found: error
          retention-days: 30

      - name: Publish the same single APK to the mobile-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release delete mobile-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create mobile-latest \
            dist/AnimPro-release-signed.apk \
            dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "AnimPro — Android release" \
            --notes "Single optimized, signed universal APK for Android. Package ID: com.nexauren.animpro. The APK is obfuscated for release. SHA256SUMS.txt verifies the download. This release contains no test/debug APK variants."
