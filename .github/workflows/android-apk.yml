name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: animpro-android-apk
  cancel-in-progress: true

jobs:
  build:
    name: Build signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
      FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
      FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android platform files if missing
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name animpro --org com.nexauren /tmp/animpro-platform
            cp -a /tmp/animpro-platform/android ./android
          fi

      - name: Configure optional google-services.json
        run: python3 .github/scripts/configure_firebase_android.py

      - name: Resolve packages
        run: flutter pub get

      - name: Generate Isar model
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Configure permanent release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 .github/scripts/prepare_android_signing.py

      - name: Static analysis
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings

      - name: Build normal universal APK
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --release --no-pub \
            --dart-define=FIREBASE_API_KEY="$FIREBASE_API_KEY" \
            --dart-define=FIREBASE_APP_ID="$FIREBASE_APP_ID" \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID="$FIREBASE_MESSAGING_SENDER_ID" \
            --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID" \
            --dart-define=GOOGLE_WEB_CLIENT_ID="$GOOGLE_WEB_CLIENT_ID" \
            --dart-define=FIREBASE_NATIVE_CONFIG="$FIREBASE_NATIVE_CONFIG"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/AnimPro-normal-release.apk

      - name: Build optimized test APK for arm64
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --release --no-pub --target-platform=android-arm64 \
            --dart-define=ANIMPRO_TEST_BUILD=true \
            --dart-define=FIREBASE_API_KEY="$FIREBASE_API_KEY" \
            --dart-define=FIREBASE_APP_ID="$FIREBASE_APP_ID" \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID="$FIREBASE_MESSAGING_SENDER_ID" \
            --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID" \
            --dart-define=GOOGLE_WEB_CLIENT_ID="$GOOGLE_WEB_CLIENT_ID" \
            --dart-define=FIREBASE_NATIVE_CONFIG="$FIREBASE_NATIVE_CONFIG"
          cp build/app/outputs/flutter-apk/app-release.apk dist/AnimPro-test-optimized-arm64.apk

      - name: Verify signatures and create checksums
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          BUILD_TOOLS="$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -s dist/AnimPro-normal-release.apk
          test -s dist/AnimPro-test-optimized-arm64.apk
          "$BUILD_TOOLS/apksigner" verify --verbose dist/AnimPro-normal-release.apk
          "$BUILD_TOOLS/apksigner" verify --verbose dist/AnimPro-test-optimized-arm64.apk
          sha256sum dist/AnimPro-normal-release.apk dist/AnimPro-test-optimized-arm64.apk > dist/SHA256SUMS.txt

      - name: Store both APKs as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: animpro-android-normal-and-optimized-test
          path: |
            dist/AnimPro-normal-release.apk
            dist/AnimPro-test-optimized-arm64.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Replace phone-download release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release delete mobile-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create mobile-latest \
            dist/AnimPro-normal-release.apk \
            dist/AnimPro-test-optimized-arm64.apk \
            dist/SHA256SUMS.txt \
            --target "${GITHUB_SHA}" \
            --title "AnimPro Android APKs (normal + optimized test)" \
            --notes "Universal APK: AnimPro-normal-release.apk. Test optimized for arm64 devices: AnimPro-test-optimized-arm64.apk. Both use the permanent signing key. The test APK has the same package ID and replaces the normal app if installed. Verify SHA256SUMS.txt before installation."
