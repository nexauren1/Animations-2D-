name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: animpro-android-apk
  cancel-in-progress: true

jobs:
  build:
    name: Build signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android platform files if missing
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name animpro --org com.nexauren /tmp/animpro-platform
            cp -a /tmp/animpro-platform/android ./android
          fi

      - name: Resolve packages
        run: flutter pub get

      - name: Generate Isar model
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Configure permanent release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 .github/scripts/prepare_android_signing.py

      - name: Static analysis
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: flutter build apk --release --no-pub

      - name: Verify APK signature and prepare checksum
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          BUILD_TOOLS="$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          mkdir -p dist
          cp "$APK" dist/AnimPro-release-signed.apk
          sha256sum dist/AnimPro-release-signed.apk > dist/SHA256SUMS.txt

      - name: Store signed APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: animpro-android-release-signed
          path: |
            dist/AnimPro-release-signed.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Replace phone-download release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release delete mobile-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create mobile-latest \
            dist/AnimPro-release-signed.apk \
            dist/SHA256SUMS.txt \
            --target "${GITHUB_SHA}" \
            --title "AnimPro Android APK (latest, signed)" \
            --notes "APK compilado e assinado com a chave de lançamento permanente. Verifica SHA256SUMS.txt antes de instalar."
