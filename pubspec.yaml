name: animpro
description: Editor de animação 2D com desenho, timeline, onion skin e rigging simples.
publish_to: "none"
version: 1.2.0+3

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  isar_community: ^3.4.1
  isar_community_flutter_libs: ^3.4.1
  path_provider: ^2.1.4
  share_plus: ^13.3.1
  archive: ^4.5.2
  image: 4.10.0
  file_picker: ^13.1.0
  audioplayers: ^6.8.1
  shared_preferences: ^2.3.2
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  url_launcher: ^6.3.3
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.16.2
  isar_community_generator: ^3.4.1

flutter:
  uses-material-design: true
